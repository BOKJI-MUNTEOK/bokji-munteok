name: Welfare Data Sync

on:
  schedule:
    # UTC 15/21/03/09시 = 한국시간 00/06/12/18시
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: welfare-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'BOKJI-MUNTEOK/bokji-munteok' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: python -m pip install 'pymongo>=4.10,<5'

      - name: Sync changed and missing welfare data
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: bokji_munteok
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_GO_KR_KEY_2: ${{ secrets.DATA_GO_KR_KEY_2 }}
          DATA_GO_KR_KEY_3: ${{ secrets.DATA_GO_KR_KEY_3 }}
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: |
          for name in MONGODB_URI DATA_GO_KR_KEY DATA_GO_KR_KEY_2 DATA_GO_KR_KEY_3; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
          python src/welfare_sync.py --seconds 5400
