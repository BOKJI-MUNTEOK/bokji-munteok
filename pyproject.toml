[project]
name = "bokji-munteok"
version = "0.1.0"
description = "복지문턱 Vercel 웹 앱"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn>=0.30,<1",
    "fpdf2==2.9.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "streamlit>=1.40", "pandas"]

[tool.vercel]
entrypoint = "main:app"

[tool.fastapi]
entrypoint = "main:app"
