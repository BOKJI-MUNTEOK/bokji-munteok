# 임시: 방문 필수 규칙 수정 전후의 전체 데이터 보고서를 같은 DB 시점에서 만든다(DB 읽기만). PR 전에 지운다.
name: tmp full report

on:
  push:
    branches: [analysis/final-weights]

permissions:
  contents: read

jobs:
  report:
    if: github.repository == 'BOKJI-MUNTEOK/bokji-munteok'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Full report (new and old rules)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: bokji_munteok
          PYTHONUTF8: '1'
        run: |
          python src/full_report.py --output-dir out/new
          mkdir -p /tmp/oldrules && git show origin/main:src/rules.py > /tmp/oldrules/rules.py
          python -c "import sys, runpy; sys.path[:0] = ['/tmp/oldrules', 'src']; sys.argv = ['full_report.py', '--output-dir', 'out/old']; runpy.run_path('src/full_report.py', run_name='__main__')"
      - uses: actions/upload-artifact@v4
        with:
          name: full-report
          path: out/
          retention-days: 3
