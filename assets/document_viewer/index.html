<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>채워진 서류 미리보기</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="toolbar" aria-label="서류 보기 도구">
    <div class="page-controls">
      <button id="previous" type="button" disabled aria-label="이전 쪽">이전</button>
      <span id="page-counter" aria-live="polite">서류 여는 중</span>
      <button id="next" type="button" disabled aria-label="다음 쪽">다음</button>
    </div>
    <div class="actions">
      <label class="zoom-label" for="zoom">크기</label>
      <select id="zoom" aria-label="서류 확대 비율" disabled>
        <option value="fit">화면에 맞춤</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
      <button id="open-window" type="button" disabled>새 창에서 크게 보기</button>
      <button id="print" class="primary" type="button" disabled>인쇄하기</button>
    </div>
  </header>
  <p id="status" role="status" aria-live="polite">서류를 열고 있습니다.</p>
  <p id="print-fallback" hidden>인쇄 화면이 열리지 않으면 <a id="print-download">PDF를 저장해서 인쇄해 주세요</a>.</p>
  <p id="compatibility" class="notice" hidden>한글 문서는 설치된 한글 프로그램에서 볼 때 글꼴이나 줄바꿈이 다를 수 있습니다. 겹치거나 잘린 글씨가 없는지 확인해 주세요.</p>
  <main id="viewport" tabindex="0" aria-label="서류 미리보기. 확대하면 좌우로 움직여 확인할 수 있습니다.">
    <div id="pages"></div>
  </main>
  <script src="vendor/purify.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
